<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#6815ef">
<title>{% block titulo %}Parceiros | Leanttro{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>:root{--p:#741cff;--ink:#0c0a32;--line:#e4d9ff}*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;color:var(--ink);background:#faf9ff}a{color:inherit;text-decoration:none}
.topbar{min-height:60px;background:linear-gradient(105deg,#7024ed,#5720d9 55%,#7a25ef);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px max(calc((100% - 980px)/2),4%);color:#fff;box-shadow:0 3px 18px #4c10ba25}
.brand{font-size:26px;font-weight:900;font-style:italic;letter-spacing:-1.6px}.brand span{font-style:normal}
.nav{display:flex;align-items:center;gap:20px;font-size:13px;font-weight:700;flex-wrap:wrap}.nav form{margin:0}
.nav .sair{background:#10072d;color:#fff;border:0;border-radius:24px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:30px 4% 60px}
h1{font-size:34px;letter-spacing:-1.4px;margin:0 0 6px;font-weight:900}h1 em{font-style:normal;color:#8c2dff}h2{font-size:20px;margin:0 0 12px;letter-spacing:-.5px}
.muted{color:#5d5780;font-size:14px;line-height:1.5}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin:0 0 20px;box-shadow:0 7px 18px #5c24a00a}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}.campo{width:100%;border:1px solid #d6c8f5;border-radius:12px;padding:11px 13px;font:inherit;background:#fff}.campo:focus{outline:2px solid var(--p);border-color:var(--p)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}@media(max-width:640px){.row{grid-template-columns:1fr}h1{font-size:28px}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:24px;padding:12px 22px;font:inherit;font-weight:800;font-size:14px;cursor:pointer;background:linear-gradient(100deg,#761aff,#8c21ff);color:#fff}
.btn.ghost{background:#fff;color:#6c12f4;border:1.5px solid var(--p)}.btn.sm{padding:7px 14px;font-size:12px}
.flash{border-radius:12px;padding:12px 16px;margin:0 0 16px;font-size:14px;font-weight:600}.flash.error{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}.flash.success{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
.scroll{overflow-x:auto}table.tb{width:100%;border-collapse:collapse;font-size:13px}.tb th{text-align:left;color:#5d5780;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--line)}.tb td{padding:10px;border-bottom:1px solid #f1ebff;vertical-align:top}
.tag{display:inline-block;background:#eee2ff;color:#5b14c9;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:800}.kpis{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 20px}.kpi{flex:1;min-width:150px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}.kpi b{display:block;font-size:22px}.kpi small{color:#5d5780}</style></head><body>
<header class="topbar"><a class="brand" href="{{ request.script_root }}/">LEANTTRO<span>.</span></a>
<nav class="nav"><a href="{{ request.script_root }}/">Central</a>
{% if g.parceiro %}<a href="{{ url_for('parceiros.valores') }}">Valores</a>{% if g.parceiro.tipo == 'revendedor' %}<a href="{{ url_for('parceiros.loja') }}">Minha loja</a>{% endif %}<a href="{{ url_for('parceiros.indicar') }}">Indicações</a>
<form method="post" action="{{ url_for('parceiros.sair') }}"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><button class="sair">Sair</button></form>{% endif %}</nav></header>
<main class="wrap">{% for cat, msg in get_flashed_messages(with_categories=true) %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
{% block conteudo %}{% endblock %}</main></body></html>
