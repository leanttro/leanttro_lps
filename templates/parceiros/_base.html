<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#6815ef">
<title>{% block titulo %}Parceiros | Leanttro{% endblock %}</title>
<meta property="og:type" content="website">
<meta property="og:title" content="{{ self.titulo() }}">
<meta property="og:description" content="Seja parceiro Leanttro. Tenha condições exclusivas, revenda sites e ganhe comissões por indicação.">
<meta property="og:image" content="https://res.cloudinary.com/dhu1cqvrb/image/upload/w_700,c_scale/b_white,c_pad,w_1200,h_630,f_jpg/v1779207400/leanttro_bohuce.png">

<meta name="twitter:image" content="https://res.cloudinary.com/dhu1cqvrb/image/upload/w_700,c_scale/b_white,c_pad,w_1200,h_630,f_jpg/v1779207400/leanttro_bohuce.png">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23fff'/%3E%3Cpath d='M20 10h11v35h19v10H20z' fill='%23741cff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>:root{--p:#741cff;--ink:#0c0a32;--line:#e4d9ff}*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;color:var(--ink);background:#faf9ff}a{color:inherit;text-decoration:none}
.topbar{height:62px;padding:0 max(5.8%,calc((100% - 1320px)/2));display:flex;align-items:center;justify-content:space-between;color:#fff;background:linear-gradient(105deg,#5010df,#7627ff 65%,#5411d8);position:relative;z-index:5;box-shadow:0 5px 25px #18004455}
.brand{display:flex;align-items:center;flex:0 0 auto}.brand img{display:block;width:158px;height:auto;max-height:42px;object-fit:contain;filter:brightness(0) invert(1)}
.nav{display:flex;align-items:center;gap:32px;font-size:13px;font-weight:650}.nav a{opacity:.96}.nav form{margin:0}
.nav .nav-pill{background:#100020;color:#fff;padding:11px 19px;border-radius:24px;border:0;font:inherit;font-weight:650;cursor:pointer;opacity:1}
.mobile-menu-toggle{display:none}
@media(max-width:850px){.topbar{padding:0 22px}.mobile-menu-toggle{display:flex;width:42px;height:42px;align-items:center;justify-content:center;flex-direction:column;gap:5px;border:1px solid #ffffff66;border-radius:12px;background:#100020;color:#fff;cursor:pointer;padding:0}.mobile-menu-toggle span{display:block;width:19px;height:2px;border-radius:2px;background:#fff}.nav{display:none;position:absolute;top:62px;left:0;right:0;z-index:10;padding:14px 22px 18px;background:linear-gradient(105deg,#5010df,#7627ff 65%,#5411d8);box-shadow:0 12px 20px #18004433;flex-direction:column;align-items:stretch;gap:4px}.nav.is-open{display:flex}.nav a{display:block;padding:13px 10px}.nav .nav-pill{margin-top:5px;text-align:center;width:100%}}
@media(max-width:520px){.brand img{width:132px}}
.wrap{max-width:980px;margin:0 auto;padding:30px 4% 60px}
h1{font-size:34px;letter-spacing:-1.4px;margin:0 0 6px;font-weight:900}h1 em{font-style:normal;color:#8c2dff}h2{font-size:20px;margin:0 0 12px;letter-spacing:-.5px}
.muted{color:#5d5780;font-size:14px;line-height:1.5}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin:0 0 20px;box-shadow:0 7px 18px #5c24a00a}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}.campo{width:100%;border:1px solid #d6c8f5;border-radius:12px;padding:11px 13px;font:inherit;background:#fff}.campo:focus{outline:2px solid var(--p);border-color:var(--p)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}@media(max-width:640px){.row{grid-template-columns:1fr}h1{font-size:28px}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:24px;padding:12px 22px;font:inherit;font-weight:800;font-size:14px;cursor:pointer;background:linear-gradient(100deg,#761aff,#8c21ff);color:#fff}
.btn.ghost{background:#fff;color:#6c12f4;border:1.5px solid var(--p)}.btn.sm{padding:7px 14px;font-size:12px}
.flash{border-radius:12px;padding:12px 16px;margin:0 0 16px;font-size:14px;font-weight:600}.flash.error{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}.flash.success{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
.scroll{overflow-x:auto}table.tb{width:100%;border-collapse:collapse;font-size:13px}.tb th{text-align:left;color:#5d5780;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--line)}.tb td{padding:10px;border-bottom:1px solid #f1ebff;vertical-align:top}
.tag{display:inline-block;background:#eee2ff;color:#5b14c9;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:800}.kpis{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 20px}.kpi{flex:1;min-width:150px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}.kpi b{display:block;font-size:22px}.kpi small{color:#5d5780}</style></head><body>
<header class="topbar"><a class="brand" href="{{ request.script_root }}/" aria-label="Leanttro"><img src="https://res.cloudinary.com/dhu1cqvrb/image/upload/f_auto,q_auto,h_80/v1779207400/leanttro_bohuce.png" alt="LEANTTRO."></a>
<nav class="nav" id="mainNav">{% if g.parceiro %}<a href="{{ url_for('parceiros.valores') }}">Valores</a>{% if g.parceiro.tipo == 'revendedor' %}<a href="{{ url_for('parceiros.loja') }}">Minha loja</a>{% endif %}<a href="{{ url_for('parceiros.indicar') }}">Indicações</a>
<form method="post" action="{{ url_for('parceiros.sair') }}"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><button class="nav-pill" type="submit">Sair</button></form>{% else %}<a class="nav-pill" href="{{ request.script_root }}/">Central</a>{% endif %}</nav>
<button class="mobile-menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="mainNav"><span></span><span></span><span></span></button></header>
<main class="wrap">{% for cat, msg in get_flashed_messages(with_categories=true) %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
{% block conteudo %}{% endblock %}</main><script>(function(){var b=document.querySelector('.mobile-menu-toggle'),n=document.getElementById('mainNav');if(!b||!n)return;b.addEventListener('click',function(){var o=n.classList.toggle('is-open');b.setAttribute('aria-expanded',o);});})();</script>
</body></html>
