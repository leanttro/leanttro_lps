<style>body{font-family:Inter,system-ui,sans-serif}.campo{width:100%;border:1px solid #cbd5e1;border-radius:.6rem;padding:.55rem .75rem;background:#fff;font-size:.92rem}.campo:focus{outline:2px solid #0f766e;border-color:#0f766e}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.5rem .9rem;border-radius:.6rem;font-weight:600;font-size:.85rem;cursor:pointer}.btn-p{background:#0f766e;color:#fff}.btn-p:hover{background:#115e59}
.btn-s{background:#fff;border:1px solid #cbd5e1;color:#334155}.btn-s:hover{background:#f1f5f9}.btn-d{background:#fff;border:1px solid #fecaca;color:#dc2626}.btn-d:hover{background:#fef2f2}</style></head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
<header class="bg-slate-900 text-white"><div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
<a href="{{ url_for('superadmin.lista') }}" class="font-bold flex items-center gap-2"><i data-lucide="server" class="w-5 h-5 text-teal-400"></i>Plataforma de LPs</a>
{% if session.get('sa') %}<div class="flex items-center gap-2">
<form method="post" action="{{ url_for('superadmin.limpar_cache') }}"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><input type="hidden" name="voltar" value="{{ request.path }}"><button class="btn btn-s !py-1.5"><i data-lucide="refresh-cw" class="w-4 h-4"></i><span class="hidden sm:inline">Limpar cache</span></button></form>
<form method="post" action="{{ url_for('superadmin.sair') }}"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><button class="btn btn-s !py-1.5"><i data-lucide="log-out" class="w-4 h-4"></i>Sair</button></form></div>{% endif %}</div></header>
<div class="max-w-6xl mx-auto px-4 py-6">
{% for cat, msg in get_flashed_messages(with_categories=true) %}{% if cat == 'senha' %}<div class="mb-3 rounded-xl px-4 py-3 text-sm bg-amber-50 border border-amber-300 text-amber-900 font-mono break-all">{{ msg }}</div>
{% else %}<div class="mb-3 rounded-xl px-4 py-3 text-sm font-medium {{ 'bg-red-50 text-red-700 border border-red-200' if cat == 'error' else 'bg-green-50 text-green-800 border border-green-200' }}">{{ msg }}</div>{% endif %}{% endfor %}
{% block conteudo %}{% endblock %}</div>
<script>document.addEventListener('DOMContentLoaded',function(){lucide.createIcons()})</script>{% block scripts %}{% endblock %}</body></html>
